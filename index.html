ameter of the DRY algorithm. Sets the penalty threshold for repetitions based on n-gram patterns.`,impactDryBase:`💡 0.8: low threshold, more tokens penalized. 1.75: default. 2.5+: only very obvious repetitions.`,descDryAllowedLength:`Minimum token length before starting to penalize repetitions. Allows short sequences before applying DRY.`,impactDryAllowedLength:`💡 0: penalizes immediately. 2: allows 2 tokens before penalizing. 5+: longer context before.`,descDryPenaltyLastN:`Number of tokens to consider when applying the DRY penalty. Similar to Repeat Last N, but specific to the DRY algorithm.`,impactDryPenaltyLastN:`💡 32: short context. 64: default. 128+: long context, detects complex patterns.`,descXtcProbability:`Probability of activating XTC (eXclusion Tree Sampling). Removes tokens with very low probability after some steps.`,impactXtcProbability:`💡 0.0: XTC disabled. 0.1-0.3: activates occasionally. >0.5: activates frequently, more deterministic.`,descXtcThreshold:`Probability threshold for token removal by XTC. Tokens with probability below this threshold are removed.`,impactXtcThreshold:`💡 0.1: low threshold, few tokens removed. 0.5: high threshold, more tokens removed.`,descMirostat:`Adaptive perplexity control mode. The system automatically adjusts the temperature during generation.`,impactMirostat:`💡 0: disabled. 1: Mirostat v1 (simpler). 2: Mirostat v2 (more precise, recommended).`,descMirostatLr:`Learning rate of the Mirostat algorithm. Controls how quickly the system adjusts the temperature.`,impactMirostatLr:`💡 0.01: smooth and slow adjustments. 0.1: default, balanced. 0.5: fast and aggressive adjustments.`,descMirostatEnt:`Target entropy that Mirostat tries to reach. Controls the desired level of perplexity in the output.`,impactMirostatEnt:`💡 1.0: very focused, less variable. 5.0: default, good balance. 10.0+: very diverse.`,descAdaptiveTarget:`Adaptive target for dynamic parameter adjustment. Controls the automatic adjustment behavior of the model.
